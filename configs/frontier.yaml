provider: fireworks
base_url: https://api.fireworks.ai/inference/v1
api_key_env: FIREWORKS_API_KEY
model: accounts/fireworks/models/deepseek-v4-flash-0731

generation:
  temperature: 0.0
  max_tokens: 2048

# Hard budget controls (plan §16 stage 3). Never exceeded.
max_examples: 15000
max_total_cost_usd: 10.0     # pilot cap; raise explicitly to scale
max_concurrency: 8
request_timeout_s: 120
max_retries: 5

# Per-token pricing used for cost accounting when the API does not return it.
# USD per 1M tokens; verify against provider pricing at run time.
price_input_per_mtok: 0.50
price_output_per_mtok: 1.50

cache: true
out_path: data/generations/frontier.jsonl
